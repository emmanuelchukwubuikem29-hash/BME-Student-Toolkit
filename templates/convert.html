{% extends "base.html" %}

{% block title %}BME Toolkit - Converter{% endblock %}

{% block content %}
    <h1>Unit &amp; Dosage Converter</h1>

    {% if error %}
        <p style="color: #c53030;">{{ error }}</p>
    {% endif %}

    {% if result %}
        <p><strong>Result:</strong> {{ result }}</p>
    {% endif %}

    <form method="post">
        <label for="conversion_type">Choose conversion:</label>
        <select name="conversion_type" id="conversion_type" onchange="showRelevantFields()">
            <option value="mgdl_to_mmoll">mg/dL to mmol/L (glucose)</option>
            <option value="mmoll_to_mgdl">mmol/L to mg/dL (glucose)</option>
            <option value="dosage">Dosage by weight (mg/kg)</option>
            <option value="bmi">BMI calculator</option>
            <option value="cm_to_in">cm to inches (height)</option>
            <option value="in_to_cm">inches to cm (height)</option>
            <option value="c_to_f">Celsius to Fahrenheit</option>
            <option value="f_to_c">Fahrenheit to Celsius</option>
        </select>

        <div id="field-value">
            <label for="value">Value:</label>
            <input type="number" step="any" name="value" id="value">
        </div>

        <div id="field-dosage" style="display:none;">
            <label for="dose_per_kg">Dose per kg (mg/kg):</label>
            <input type="number" step="any" name="dose_per_kg" id="dose_per_kg">

            <label for="weight_kg">Body weight in kg:</label>
            <input type="number" step="any" name="weight_kg" id="weight_kg">
        </div>

        <div id="field-bmi" style="display:none;">
            <label for="weight_kg_bmi">Weight in kg:</label>
            <input type="number" step="any" name="weight_kg_bmi" id="weight_kg_bmi">

            <label for="height_m">Height in meters:</label>
            <input type="number" step="any" name="height_m" id="height_m">
        </div>
        
        <div id="field-height" style="display:none;">
            <label for="height_value">Value:</label>
            <input type="number" step="any" name="height_value" id="height_value">
        </div>

        <div id="field-temp" style="display:none;">
            <label for="temp_value">Value:</label>
            <input type="number" step="any" name="temp_value" id="temp_value">
        </div>
        
        <button type="submit">Convert</button>
    </form>

    <script>
        // Shows only the input fields relevant to the selected conversion type,
        // hides the rest. Runs once on page load, and again whenever the
        // dropdown changes.
        function showRelevantFields() {
            const type = document.getElementById("conversion_type").value;

            const valueField = document.getElementById("field-value");
            const dosageField = document.getElementById("field-dosage");
            const bmiField = document.getElementById("field-bmi");
            const heightField = document.getElementById("field-height");
            const tempField = document.getElementById("field-temp");

            valueField.style.display = "none";
            dosageField.style.display = "none";
            bmiField.style.display = "none";
            heightField.style.display = "none";
            tempField.style.display = "none";

            if (type === "mgdl_to_mmoll" || type === "mmoll_to_mgdl") {
                valueField.style.display = "block";
            } else if (type === "dosage") {
                dosageField.style.display = "block";
            } else if (type === "bmi") {
                bmiField.style.display = "block";
            } else if (type === "cm_to_in" || type === "in_to_cm") {
                heightField.style.display = "block";
            } else if (type === "c_to_f" || type === "f_to_c") {
                tempField.style.display = "block";
            }
        }

        // Run once when the page first loads, so the correct fields show
        // immediately based on whatever option is selected by default.
        showRelevantFields();
    </script>
{% endblock %}
