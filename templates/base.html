<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BME Toolkit{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">BME Toolkit</a>
        <a href="{{ url_for('convert') }}">Converter</a>
        <a href="{{ url_for('tasks') }}">Tasks</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p style="background:#c6f6d5; padding:0.5rem; border-radius:4px;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
</body>
</html>
