{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}
    <h1>Edit Task</h1>

    <form method="post">
        <div>
            <label for="title">Task title:</label>
            <input type="text" name="title" id="title" value="{{ task.title }}" required>
        </div>

        <div>
            <label for="assignee">Assigned to:</label>
            <input type="text" name="assignee" id="assignee" value="{{ task.assignee }}" required>
        </div>

        <div>
            <label for="deadline">Deadline:</label>
            <input type="date" name="deadline" id="deadline" value="{{ task.deadline }}" required>
            <small id="deadline-warning" style="color:#dc2626; display:none;">Deadline cannot be in the past.</small>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('tasks') }}">Cancel</a></p>

<script>
    const deadlineInput = document.getElementById("deadline");
    const today = new Date().toISOString().split("T")[0];
    deadlineInput.setAttribute("min", today);

    const warning = document.getElementById("deadline-warning");
    deadlineInput.addEventListener("change", function () {
        if (deadlineInput.value < today) {
            warning.style.display = "block";
            deadlineInput.value = "";
        } else {
            warning.style.display = "none";
        }
    });
</script>
{% endblock %}
